<!doctype html><html lang="en"><head><meta charset="utf-8"/><title>DevMuse Demo Store</title></head>
<body><h1>DevMuse Demo Store</h1><label>Item <select id="item"><option value="book">Book</option><option value="mouse">Mouse</option><option value="keyboard">Keyboard</option></select></label>
<label>Quantity <input id="quantity" type="number" value="1" min="1" /></label><button id="quote">Get quote</button><output id="result" aria-live="polite"></output>
<script>document.querySelector('#quote').addEventListener('click', async () => { const res=await fetch('/orders/quote',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({item:document.querySelector('#item').value,quantity:Number(document.querySelector('#quantity').value)})});const data=await res.json();document.querySelector('#result').textContent=res.ok?'Total: $'+data.total:JSON.stringify(data.detail); });</script></body></html>
